name: Daily Stock Prediction & Execution Pipeline

on:
  schedule:
    # 10:02 AM Eastern Time (14:02 UTC) Monday through Friday
    - cron: "2 14 * * 1-5"
  workflow_dispatch: # Allows manual trigger anytime from GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          pip install pandas yfinance supabase

      - name: Step 1 - Fetch Opening & Pre-Market Data
        env:
          SUPABASE_URL: "https://pdkgphcwtfktnmegjtdx.supabase.co"
          SUPABASE_KEY: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
        run: |
          python fetch_daily_baseline.py

      - name: Step 2 - Hit Vercel Cron API to Run Strategy & Log Top 3
        run: |
          curl -X GET "https://stock-quant-system.vercel.app/api/cron/fetch-data" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
